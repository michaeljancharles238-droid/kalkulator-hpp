<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Kalkulator HPP Warung</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Aman dari takik layar HP saat dipasang sebagai aplikasi */
html { padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
[hidden] { display:none !important; }
img { max-width:100%; }

/* Tata letak: satu kolom kartu di atas kertas hangat. Angka selalu memakai mono
   tabular dan dipisah garis putus-putus — meniru nota warung, bukan tabel kantor. */
:root {
  color-scheme: light;
  --kertas:#f7f5f1; --kartu:#ffffff; --kartu-2:#f1eee9; --kartu-3:#e8e4db;
  --garis:#e4dfd5; --garis-kuat:#cfc8b9;
  --tinta:#17150f; --tinta-2:#5b5649; --tinta-3:#857f70;
  --aksen:#c2690b; --aksen-tinta:#a0560a; --aksen-lembut:rgba(194,105,11,.10);

  --baik:#0ca30c; --hati:#fab219; --serius:#ec835a; --kritis:#d03b3b;
  --baik-tinta:#006300; --hati-tinta:#8a5c00; --kritis-tinta:#b02f2f;

  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;

  --grid:#e1e0d9; --sumbu:#c3c2b7;
  --bayang:0 1px 2px rgba(23,21,15,.04), 0 6px 20px rgba(23,21,15,.05);
  --ui:'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --kertas:#121110; --kartu:#1b1a17; --kartu-2:#232120; --kartu-3:#2b2926;
    --garis:#2d2b26; --garis-kuat:#403d35;
    --tinta:#f2efe8; --tinta-2:#aea89a; --tinta-3:#837d6f;
    --aksen:#f0a33a; --aksen-tinta:#f3b05a; --aksen-lembut:rgba(240,163,58,.14);
    --baik-tinta:#35c17f; --hati-tinta:#fab219; --kritis-tinta:#f06a72;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
    --grid:#2c2c2a; --sumbu:#383835;
    --bayang:0 1px 2px rgba(0,0,0,.35), 0 6px 20px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --kertas:#121110; --kartu:#1b1a17; --kartu-2:#232120; --kartu-3:#2b2926;
  --garis:#2d2b26; --garis-kuat:#403d35;
  --tinta:#f2efe8; --tinta-2:#aea89a; --tinta-3:#837d6f;
  --aksen:#f0a33a; --aksen-tinta:#f3b05a; --aksen-lembut:rgba(240,163,58,.14);
  --baik-tinta:#35c17f; --hati-tinta:#fab219; --kritis-tinta:#f06a72;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
  --grid:#2c2c2a; --sumbu:#383835;
  --bayang:0 1px 2px rgba(0,0,0,.35), 0 6px 20px rgba(0,0,0,.3);
}

* { box-sizing:border-box; }
body {
  margin:0; background:var(--kertas); color:var(--tinta);
  font-family:var(--ui); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button, input, select { font:inherit; color:inherit; }
button { background:none; border:none; cursor:pointer; }
.num { font-family:var(--mono); font-variant-numeric:tabular-nums; }
@media (prefers-reduced-motion: reduce) { * { animation:none!important; transition:none!important; } }

/* Pita di atas header sticky, agar konten tidak terlihat di bawah bar sistem */
body::before {
  content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px);
  z-index:30; background:var(--kertas);
}

.wrap {
  max-width:1200px; margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 88px;
}

/* ===== HEADER ===== */
.topbar {
  position:sticky; top:env(safe-area-inset-top, 0px); z-index:20;
  background:var(--kertas); border-bottom:1px solid var(--garis);
}
.topbar-in {
  max-width:1200px; margin:0 auto; display:flex; align-items:center; gap:14px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:12px;
}
.mark { display:flex; align-items:center; gap:9px; min-width:0; }
.mark .glyph {
  width:32px; height:32px; border-radius:9px; flex-shrink:0; display:grid; place-items:center;
  background:var(--aksen); color:#fff; font-weight:800; font-size:12px; letter-spacing:.02em;
}
.mark b { font-size:15px; font-weight:800; letter-spacing:-.02em; white-space:nowrap; }
/* Nomor versi selalu terlihat — supaya ketahuan kalau sebuah perangkat masih
   menjalankan aplikasi lama dari cache. */
.ver { font-size:10.5px; font-weight:700; letter-spacing:.03em; color:var(--tinta-3);
  background:var(--kartu-2); border:1px solid var(--garis); border-radius:7px;
  padding:2px 7px; white-space:nowrap; font-family:var(--mono); }
.ver.beda { color:var(--hati-tinta); background:rgba(250,178,25,.14); border-color:transparent; }
.tabs { display:flex; gap:2px; margin-left:auto; background:var(--kartu-2); border-radius:11px; padding:3px; }
.tabs button {
  padding:7px 14px; border-radius:9px; font-size:13px; font-weight:600; color:var(--tinta-2);
  white-space:nowrap; transition:background .15s, color .15s;
}
.tabs button[aria-selected="true"] { background:var(--kartu); color:var(--tinta); box-shadow:var(--bayang); }
.icon-btn {
  width:34px; height:34px; border-radius:10px; display:grid; place-items:center;
  color:var(--tinta-2); border:1px solid var(--garis); background:var(--kartu); flex-shrink:0;
}
.icon-btn:hover { color:var(--tinta); }
@media (max-width:620px) {
  .topbar-in { flex-wrap:wrap; gap:10px; }
  .tabs { margin-left:0; order:3; width:100%; }
  .tabs button { flex:1; padding:8px 4px; text-align:center; }
  .icon-btn { margin-left:auto; }
}

/* ===== KARTU & TIPOGRAFI ===== */
.sec { margin-block:28px 0; }
.sec-head { display:flex; align-items:baseline; justify-content:space-between; gap:14px; margin-bottom:15px; flex-wrap:wrap; }
h1 { font-size:23px; font-weight:800; letter-spacing:-.03em; margin:0; text-wrap:balance; }
h2 { font-size:15px; font-weight:700; letter-spacing:-.015em; margin:0; }
h3 { font-size:13px; font-weight:700; letter-spacing:-.01em; margin:0; }
.eyebrow { font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--tinta-3); }
.sub { font-size:13px; color:var(--tinta-2); line-height:1.6; }
.card { background:var(--kartu); border:1px solid var(--garis); border-radius:18px; padding:20px; }
.card + .card { margin-top:16px; }

/* Di layar lebar, satu kolom panjang membuang ruang samping dan memaksa menggulir
   jauh. Dua kartu grafik diletakkan berdampingan, dan jaraknya dilonggarkan. */
.dua { display:grid; gap:16px; margin-top:16px; }
.dua > .card + .card { margin-top:0; }
.dua + .card, .tiles + .card { margin-top:16px; }
@media (min-width:940px) {
  .dua { grid-template-columns:repeat(2, minmax(0,1fr)); }
  .dua + .card, .tiles + .card { margin-top:18px; }
  .sec { margin-block:36px 0; }
  .sec-head { margin-bottom:18px; }
  h1 { font-size:26px; }
  .card { padding:24px; }
  .card + .card { margin-top:18px; }
}

/* ===== PETAK STATISTIK ===== */
.tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:14px; }
.tile { background:var(--kartu); border:1px solid var(--garis); border-radius:16px; padding:18px; min-width:0; }
.tile .k { font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--tinta-3); }
.tile .v { font-size:27px; font-weight:800; letter-spacing:-.03em; margin-top:9px; line-height:1.1; overflow-wrap:anywhere; }
.tile .d { font-size:12px; color:var(--tinta-2); margin-top:5px; line-height:1.45; }
@media (min-width:940px) { .tile { padding:20px; } .tile .v { font-size:29px; } }
.tile.ok .v { color:var(--baik-tinta); }
.tile.warn .v { color:var(--hati-tinta); }
.tile.bad .v { color:var(--kritis-tinta); }

/* ===== LENCANA STATUS (warna tidak pernah sendirian) ===== */
.chip {
  display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700;
  padding:3px 9px; border-radius:999px; white-space:nowrap;
}
.chip .dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.chip.ok   { background:rgba(12,163,12,.12);  color:var(--baik-tinta); }
.chip.ok   .dot { background:var(--baik); }
.chip.warn { background:rgba(250,178,25,.16); color:var(--hati-tinta); }
.chip.warn .dot { background:var(--hati); }
.chip.bad  { background:rgba(208,59,59,.12);  color:var(--kritis-tinta); }
.chip.bad  .dot { background:var(--kritis); }
.chip.mute { background:var(--kartu-2); color:var(--tinta-3); }
.chip.mute .dot { background:var(--tinta-3); }

/* ===== TOMBOL ===== */
.btn {
  display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:11px;
  font-size:13px; font-weight:700; border:1px solid transparent; transition:opacity .15s, background .15s;
}
.btn:focus-visible, .icon-btn:focus-visible, .tabs button:focus-visible, input:focus-visible, select:focus-visible {
  outline:2px solid var(--aksen); outline-offset:2px;
}
.btn.primary { background:var(--aksen); color:#fff; }
.btn.primary:hover { opacity:.9; }
.btn.ghost { background:var(--kartu); border-color:var(--garis-kuat); color:var(--tinta); }
.btn.ghost:hover { background:var(--kartu-2); }
.btn.quiet { color:var(--tinta-2); padding:7px 10px; }
.btn.quiet:hover { color:var(--tinta); background:var(--kartu-2); }
.btn.danger { color:var(--kritis-tinta); border-color:rgba(208,59,59,.35); background:transparent; }
.btn.danger:hover { background:rgba(208,59,59,.08); }
.btn:disabled { opacity:.45; cursor:not-allowed; }

/* ===== FORM ===== */
label.lbl { display:block; font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--tinta-3); margin-bottom:6px; }
.inp {
  width:100%; padding:9px 11px; border-radius:10px; border:1px solid var(--garis-kuat);
  background:var(--kartu); font-size:14px; min-width:0;
}
.inp:focus { outline:none; border-color:var(--aksen); box-shadow:0 0 0 3px var(--aksen-lembut); }
.inp.n { font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right; }
.inp.err { border-color:var(--kritis); }
select.inp { appearance:none; padding-right:26px;
  background-image:linear-gradient(45deg,transparent 50%,var(--tinta-3) 50%),linear-gradient(135deg,var(--tinta-3) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%, calc(100% - 10px) 50%;
  background-size:5px 5px, 5px 5px; background-repeat:no-repeat; }
.field { min-width:0; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:520px) { .grid2 { grid-template-columns:1fr; } }

/* ===== BARIS BAHAN (inti pengisian data) ===== */
.rows { display:flex; flex-direction:column; gap:8px; }
.row-h, .row-i {
  display:grid; grid-template-columns:minmax(0,1fr) 92px 74px 108px 34px;
  gap:8px; align-items:center;
}
/* Di layar lebar, kolom angka dilebarkan supaya tidak terlihat seperti kotak kecil
   di samping kolom nama yang sangat panjang. */
@media (min-width:760px) {
  /* Hanya di tab Bahan — di sana barisnya selebar halaman. Di editor produk
     barisnya berada dalam kolom sempit, jadi nama bahan yang perlu ruang. */
  #v-bahan .row-h, #v-bahan .row-i { grid-template-columns:minmax(0,1fr) 118px 94px 142px 40px; gap:12px; }
  .row-i { padding:10px 12px; }
}
/* Sisi kiri untuk mengisi, sisi kanan untuk melihat hasilnya — tidak perlu
   menggulir jauh setiap kali mengubah satu angka. */
.editor-grid { display:grid; gap:16px; margin-top:16px; align-items:start; }
@media (min-width:1040px) {
  .editor-grid { grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:18px; margin-top:18px; }
}
.row-h { font-size:10.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--tinta-3); padding:0 2px; }
.row-h span:nth-child(n+2) { text-align:right; }
.row-h span:nth-child(3) { text-align:left; }
.row-i { background:var(--kartu-2); border-radius:12px; padding:8px; }
.row-i .cost { font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:13px; font-weight:600; text-align:right; padding-right:4px; }
.row-i .cost small { display:block; font-size:10px; font-weight:400; color:var(--tinta-3); font-family:var(--ui); }
.row-i .amt-wrap { display:contents; }
.row-i .del { width:34px; height:34px; border-radius:9px; display:grid; place-items:center; color:var(--tinta-3); }
.row-i .del:hover { color:var(--kritis-tinta); background:rgba(208,59,59,.1); }
.row-note { grid-column:1/-1; font-size:11.5px; color:var(--kritis-tinta); padding:0 2px; }
@media (max-width:640px) {
  .row-h { display:none; }
  .row-i { grid-template-columns:minmax(0,1fr) 34px; gap:7px; padding:10px; }
  .row-i .amt-wrap { grid-column:1; display:grid; grid-template-columns:repeat(auto-fit,minmax(74px,1fr)); gap:7px; }
  .row-i .cost { grid-column:1; text-align:left; display:flex; align-items:baseline; gap:7px; }
  .row-i .cost small { display:inline; }
  .row-i .del { grid-row:1; grid-column:2; }
}

/* ===== NOTA / RINGKASAN BIAYA ===== */
.nota { font-family:var(--mono); font-size:13px; }
.nota .line { display:flex; justify-content:space-between; gap:14px; padding:7px 0; border-bottom:1px dashed var(--garis-kuat); }
.nota .line:last-child { border-bottom:none; }
.nota .line span:first-child { font-family:var(--ui); color:var(--tinta-2); font-size:13px; }
.nota .line b { font-variant-numeric:tabular-nums; font-weight:600; }
.nota .line.total { border-top:1.5px solid var(--tinta); border-bottom:none; margin-top:4px; padding-top:10px; }
.nota .line.total span:first-child, .nota .line.total b { font-size:14.5px; font-weight:800; color:var(--tinta); }

.hero-num { font-size:34px; font-weight:800; letter-spacing:-.035em; line-height:1.05; font-family:var(--mono); font-variant-numeric:tabular-nums; }

/* ===== KARTU "MAU BIKIN BERAPA" ===== */
.bl-input { display:flex; align-items:center; gap:10px; margin-top:14px; }
.bl-input .inp {
  width:124px; font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:20px; font-weight:750; text-align:right; padding:11px 13px;
}
.bl-input .sat { font-size:13px; font-weight:650; color:var(--tinta-2); }
.bl-cepat { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:10px; }
.chip-cepat {
  font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:11.5px; font-weight:650;
  padding:5px 11px; border-radius:9px; color:var(--tinta-2);
  background:var(--kartu-2); border:1px solid var(--garis);
}
.chip-cepat.on { color:var(--aksen-tinta); background:var(--aksen-lembut); border-color:transparent; }
.bl-batch { font-size:11px; color:var(--tinta-3); margin-left:auto; font-family:var(--mono); }

.bl-tabel { margin-top:16px; }
.bl-head, .bl-row {
  display:grid; grid-template-columns:minmax(0,1fr) 92px 84px 92px; gap:10px; align-items:baseline;
}
.bl-head {
  font-size:10px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  color:var(--tinta-3); padding:0 2px 8px; border-bottom:1px solid var(--garis);
}
.bl-head span:nth-child(n+2) { text-align:right; }
.bl-row { padding:9px 2px; border-bottom:1px dashed var(--garis); font-size:12.5px; }
.bl-row:last-child { border-bottom:none; }
.bl-row .nm { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bl-row .bt, .bl-row .bl, .bl-row .rp {
  text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:600;
}
.bl-row .bt { color:var(--tinta); }
.bl-row .bl { color:var(--tinta-2); font-weight:550; }
.bl-row small { display:block; font-family:var(--ui); font-size:10px; font-weight:500; color:var(--tinta-3); margin-top:2px; }
.bl-row.err { opacity:.5; }

.bl-hasil { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
.bl-hasil > div { padding:11px 13px; border-radius:13px; background:var(--kartu-2); }
.bl-hasil .eyebrow { display:block; margin-bottom:3px; }
.bl-hasil b { font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:16px; font-weight:800; letter-spacing:-.02em; }
.bl-hasil .untung b { color:var(--baik-tinta); }
.bl-hasil .rugi b { color:var(--kritis-tinta); }
/* Di HP kolomnya tidak muat berdampingan. Jumlah beli justru paling dipakai
   saat di pasar, jadi bukan dibuang — barisnya yang dipecah dua tingkat. */
@media (max-width:480px) {
  .bl-head { display:none; }
  .bl-row { display:flex; flex-wrap:wrap; align-items:baseline; gap:3px 10px; padding:11px 2px; }
  .bl-row .nm { flex:1 1 100%; white-space:normal; font-size:13px; }
  .bl-row .bt, .bl-row .bl { text-align:left; }
  .bl-row .bl { font-size:11.5px; }
  .bl-row .bl::before { content:'beli '; font-family:var(--ui); color:var(--tinta-3); }
  .bl-row .rp { margin-left:auto; }
  .bl-row small { display:inline; margin-left:5px; }
}

/* ===== TABEL ===== */
.tbl-wrap { overflow-x:auto; margin:0 -4px; padding:0 4px; }
table { border-collapse:collapse; width:100%; font-size:13px; min-width:560px; }
th { text-align:right; font-size:10.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--tinta-3); padding:0 10px 9px; white-space:nowrap; }
th:first-child { text-align:left; }
td { padding:11px 10px; border-top:1px solid var(--garis); text-align:right; white-space:nowrap; }
td:first-child { text-align:left; white-space:normal; min-width:150px; }
tbody tr:hover { background:var(--kartu-2); }
.pname { display:flex; align-items:center; gap:9px; }
.pname .em { font-size:17px; }
.pname b { font-weight:600; }

/* ===== GRAFIK ===== */
.chart { width:100%; display:block; overflow:visible; }
.chart text { font-family:var(--ui); }
.legend { display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:14px; }
.legend .it { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--tinta-2); min-width:0; }
.legend .sw { width:11px; height:11px; border-radius:3px; flex-shrink:0; }
.legend .it b { color:var(--tinta); font-weight:600; font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:11.5px; }

/* ===== KARTU PRODUK ===== */
.pgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(268px,1fr)); gap:14px; }
.pcard {
  background:var(--kartu); border:1px solid var(--garis); border-radius:16px; padding:18px;
  text-align:left; width:100%; display:flex; flex-direction:column; gap:10px; transition:border-color .15s, transform .1s;
}

<script>
/* ===================================================================
   KALKULATOR HPP WARUNG
   Inti perhitungan:
     harga satuan bahan = harga kemasan ÷ isi kemasan   (disamakan ke gr / ml / pcs)
     biaya bahan        = Σ harga satuan × jumlah terpakai
     biaya produksi     = biaya bahan + biaya operasional
     HPP per porsi      = biaya produksi ÷ jumlah porsi jadi
     margin             = (harga jual − HPP) ÷ harga jual      ← % dari harga jual
     markup             = (harga jual − HPP) ÷ HPP             ← % dari modal
   Margin dan markup sering tertukar. Pada target 35%:
     margin 35% → harga jual = HPP ÷ 0,65
     markup 35% → harga jual = HPP × 1,35   (hasilnya jauh lebih rendah)
   =================================================================== */

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const clamp = (n,a,b) => Math.min(Math.max(n,a),b);

/* Angka gaya Indonesia: titik ribuan, koma desimal. Menerima ketikan apa adanya. */
function num(v) {
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  if (v == null) return 0;
  const s = String(v).replace(/[^\d,.-]/g, '');
  const minus = s.trim().startsWith('-');
  const t = s.replace(/-/g,'').replace(/\./g,'').replace(',', '.');
  const n = parseFloat(t);
  return isFinite(n) ? (minus ? -n : n) : 0;
}
const fmtN = (n, d) => new Intl.NumberFormat('id-ID', { maximumFractionDigits: d==null?2:d }).format(n||0);
/* Untuk kolom isian: nol ditulis kosong, bukan "0". Angka nol di kotak isian
   hanya jadi penghalang — harus dihapus dulu sebelum bisa mengetik. Kosong
   lebih jujur juga: memang belum diisi. Saat dibaca, kosong tetap bernilai 0. */
const fmtIsi = (n, d) => (num(n) === 0 ? '' : fmtN(n, d));
const rp  = n => 'Rp ' + fmtN(Math.round(n||0), 0);
/* Harga satuan sering di bawah seribu rupiah — di situ desimal masih berarti. */
const rpHalus = n => { const v = n||0; return 'Rp ' + fmtN(v, Math.abs(v) < 100 ? 2 : 0); };
const pct = n => (n||0).toFixed(0) + '%';

const SAT = {
  gr:  { fam:'berat',  f:1,    nama:'gram' },
  kg:  { fam:'berat',  f:1000, nama:'kilogram' },
  ml:  { fam:'volume', f:1,    nama:'mililiter' },
  l:   { fam:'volume', f:1000, nama:'liter' },
  pcs: { fam:'buah',   f:1,    nama:'buah / pcs' },
};
const SAT_KEYS = Object.keys(SAT);
const EMOJI = ['🍽️','🥤','🧋','☕','🍵','🧊','🍜','🍚','🍗','🍲','🥟','🍛','🍢','🧁','🥣','🍱'];
const SERI = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];

const SETEL_AWAL = { tarifListrik:1564, upahJam:12500, targetMargin:35, pembulatan:500,
                     hargaGas:25000, jamGas:40, tarifAir:5000, batchBulan:26 };

const S = {
  bahan: {}, produk: {}, setel: { ...SETEL_AWAL },
  tab: 'ringkasan', editId: null, boleh: true, siap: false, tundaRender: false,
  cariBahan: '', cariProduk: '',
};

/* ===================================================================
   PENCARIAN

   Menyaring tanpa menggambar ulang: baris yang tidak cocok disembunyikan,
   bukan dibuang. Mengetik jadi tidak memicu render — kotak isian yang sedang
   dipakai tidak ikut dibongkar, dan kursor tetap di tempatnya.
   Kata kuncinya disimpan di S supaya saringan bertahan kalau ada render
   dari sebab lain (mis. perubahan masuk dari perangkat lain).
   =================================================================== */
function kotakCariHTML(kunci, isyarat, jumlah) {
  return `<div class="cari-wrap">
    <svg class="cari-ikon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input class="inp cari-inp" data-cari="${kunci}" value="${esc(S[kunci] || '')}"
           placeholder="${esc(isyarat)}" aria-label="${esc(isyarat)}" autocomplete="off" type="search">
    <button class="cari-hapus" data-hapus-cari="${kunci}" aria-label="Hapus pencarian"${S[kunci] ? '' : ' hidden'}>✕</button>
    <span class="cari-jml" data-cari-jml="${kunci}" aria-live="polite">${jumlah}</span>
  </div>`;
}

const cocokCari = (teks, q) => String(teks || '').toLowerCase().includes(q);

function terapkanCari() {
  // Pustaka bahan — nama dibaca dari kolom isiannya, jadi hasil ketikan yang
  // belum sempat digambar ulang pun ikut terbaca.
  const qb = String(S.cariBahan || '').toLowerCase().trim();
  const barisBahan = document.querySelectorAll('#v-bahan .row-i[data-bahan]');
  let adaBahan = 0;
  barisBahan.forEach(el => {
    const isian = el.querySelector('[data-f="nama"]');
    const nama = isian ? isian.value : (S.bahan[el.dataset.bahan] || {}).nama;
    const tampil = !qb || cocokCari(nama, qb);
    el.hidden = !tampil;
    if (tampil) adaBahan++;
  });
  setelahCari('bahan', barisBahan.length, adaBahan, qb);

  // Daftar produk
  const qp = String(S.cariProduk || '').toLowerCase().trim();
  const kartu = document.querySelectorAll('#v-produk .pcard[data-buka]');
  let adaProduk = 0;
  kartu.forEach(el => {
    const nama = (S.produk[el.dataset.buka] || {}).nama;
    const tampil = !qp || cocokCari(nama, qp);
    el.hidden = !tampil;
    if (tampil) adaProduk++;
  });
  setelahCari('produk', kartu.length, adaProduk, qp);
}

/* Jumlah hasil, tombol hapus, dan pesan saat tidak ada yang cocok. */
function setelahCari(jenis, total, cocok, q) {
  const kunci = jenis === 'bahan' ? 'cariBahan' : 'cariProduk';
  const jml = document.querySelector(`[data-cari-jml="${kunci}"]`);
  if (jml) jml.textContent = q ? `${cocok} dari ${total}` : `${total}`;
  const hapus = document.querySelector(`[data-hapus-cari="${kunci}"]`);
  if (hapus) hapus.hidden = !q;
  const kosong = document.querySelector(`[data-cari-kosong="${jenis}"]`);
  if (kosong) {
    kosong.hidden = !(q && cocok === 0);
    const isi = kosong.querySelector('.empty');
    if (isi && q && cocok === 0) isi.innerHTML = `<b>Tidak ada yang cocok</b>Tidak ada ${jenis} bernama “${esc(q)}”.`;
  }
}

/* ===================================================================
   PERHITUNGAN
   =================================================================== */
function hargaDasar(b) {                      // rupiah per gr / ml / pcs
  const isi = num(b && b.isi), h = num(b && b.harga);
  if (!isi || !h || !SAT[b.satuan]) return 0;
  return h / (isi * SAT[b.satuan].f);
}
function biayaBaris(it) {
  const b = S.bahan[it.bahanId];
  if (!b) return { rp:0, err:'Bahan ini sudah dihapus dari pustaka' };
  if (!SAT[it.satuan] || !SAT[b.satuan]) return { rp:0, err:'Satuan tidak dikenal' };
  if (SAT[it.satuan].fam !== SAT[b.satuan].fam)
    return { rp:0, err:`Satuan ${it.satuan} tidak sejenis dengan kemasan (${b.satuan}) — ganti salah satunya` };
  return { rp: hargaDasar(b) * num(it.jumlah) * SAT[it.satuan].f, err:null };
}
/* ===================================================================
   BIAYA OPERASIONAL

   Tiap cara hitung memakai angka yang memang diketahui pemilik warung —
   harga tabung, lama nyala, umur alat — bukan rumus yang harus dihitung
   sendiri di luar aplikasi lalu diketik hasilnya.

   Angka yang berlaku untuk seluruh usaha (tarif listrik, harga gas, tarif
   air, rata-rata batch per bulan) ada di Pengaturan, bukan diulang di tiap
   baris. Yang di baris hanyalah yang berbeda-beda per produk.
   =================================================================== */
const OPS_MODE = {
  rp:      { nama:'Rupiah',          ikon:'💵', ket:'ketik langsung' },
  listrik: { nama:'Listrik',         ikon:'⚡', ket:'watt × menit × tarif listrik' },
  gas:     { nama:'Gas LPG',         ikon:'🔥', ket:'dari harga tabung dan lama nyala' },
  jam:     { nama:'Tenaga kerja',    ikon:'👤', ket:'menit × upah per jam' },
  air:     { nama:'Air',             ikon:'💧', ket:'liter × tarif air' },
  bulanan: { nama:'Biaya bulanan',   ikon:'🧾', ket:'sewa, wifi, iuran — dibagi batch sebulan' },
  susut:   { nama:'Penyusutan alat', ikon:'🔧', ket:'harga alat ÷ umur pakainya' },
};
const OPS_URUT = ['listrik', 'gas', 'jam', 'air', 'bulanan', 'susut', 'rp'];

/* Rupiah per menit nyala, dari harga satu tabung dan berapa lama tabung itu
   habis. Dua angka yang bisa ditaksir pemiliknya sendiri — tidak perlu tahu
   nilai kalori LPG. */
function rpPerMenitGas() {
  const jam = num(S.setel.jamGas);
  return jam > 0 ? num(S.setel.hargaGas) / (jam * 60) : 0;
}

function biayaOps(o) {
  const s = S.setel;
  switch (o.mode) {
    case 'listrik': return (num(o.watt)/1000) * (num(o.menit)/60) * num(s.tarifListrik);
    case 'gas':     return rpPerMenitGas() * Math.max(num(o.tungku) || 1, 0) * num(o.menit);
    case 'jam':     return (num(o.menit)/60) * num(o.tarif || s.upahJam);
    case 'air':     return num(o.liter) * (num(s.tarifAir) / 1000);
    case 'bulanan': return num(s.batchBulan) > 0 ? num(o.sebulan) / num(s.batchBulan) : 0;
    case 'susut':   return (num(o.bulan) > 0 && num(s.batchBulan) > 0)
                           ? num(o.harga) / (num(o.bulan) * num(s.batchBulan)) : 0;
    default:        return num(o.rp);
  }
}

/* Keterangan kecil di bawah angka biaya: menunjukkan asal angkanya,
   supaya tidak ada hasil yang muncul tanpa bisa ditelusuri. */
function ketOps(o) {
  const s = S.setel;
  switch (o.mode) {
    case 'listrik': return `${fmtN(num(o.watt),0)} W × ${fmtN(num(o.menit),0)} mnt @ ${rp(s.tarifListrik)}/kWh`;
    case 'gas':     return `${fmtN(Math.max(num(o.tungku)||1,0),0)} tungku × ${fmtN(num(o.menit),0)} mnt @ ${rpHalus(rpPerMenitGas())}/mnt`;
    case 'jam':     return `${fmtN(num(o.menit),0)} menit × ${rp(num(o.tarif) || num(s.upahJam))}/jam`;
    case 'air':     return `${fmtN(num(o.liter))} liter @ ${rp(s.tarifAir)}/m³`;
    case 'bulanan': return `${rp(num(o.sebulan))} ÷ ${fmtN(num(s.batchBulan),0)} batch sebulan`;
    case 'susut':   return `${rp(num(o.harga))} ÷ ${fmtN(num(o.bulan),0)} bln × ${fmtN(num(s.batchBulan),0)} batch`;
    default:        return 'per batch';
  }
}
/* Semua resep ditulis untuk SATU porsi: tambah jumlah porsi jadi, kebutuhan
   bahan ikut naik dan HPP per porsi tetap.

   Dulu ada pilihan kedua, "satu batch penuh", dan data lama masih membawanya —
   baik sebagai basis:'batch' maupun sebagai produk tanpa field basis sama
   sekali, yang artinya sama. Keduanya tetap dibaca sebagai batch di sini
   supaya angkanya tidak melenceng sebelum sempat dikonversi; keBasisPorsi()
   yang mengubahnya jadi per porsi, dengan membagi takarannya, sehingga HPP-nya
   keluar sama persis. */
const basisDari = p => (p && p.basis === 'porsi') ? 'porsi' : 'batch';

function hitung(p) {
  const basis = basisDari(p);
  const porsi = Math.max(num(p.porsi), 0);
  // Porsi kosong dianggap 1 pada basis "porsi", supaya biaya per porsi sudah
  // terlihat sambil resepnya diketik — bukan Rp 0 sampai kolom porsi diisi.
  const porsiEf = basis === 'porsi' ? (porsi || 1) : porsi;
  const kali = basis === 'porsi' ? porsiEf : 1;   // pengali menuju satu batch

  const items = (p.bahan || []).map(it => {
    const b = biayaBaris(it);
    return Object.assign({}, it, b, {
      jumlahTulis: num(it.jumlah),            // angka yang diketik pengguna
      jumlahBatch: num(it.jumlah) * kali,     // kebutuhan untuk satu batch
      rpTulis: b.rp,
      rp: b.rp * kali,                        // biaya untuk satu batch
    });
  });
  const bahanRp = items.reduce((s,i) => s + i.rp, 0);
  const opsList = (p.ops || []).map(o => Object.assign({}, o, { rp: biayaOps(o) }));
  const opsRp = opsList.reduce((s,o) => s + o.rp, 0);
  const total = bahanRp + opsRp;
  const hpp   = porsiEf > 0 ? total / porsiEf : 0;
  const jual  = num(p.hargaJual);
  const laba  = jual > 0 ? jual - hpp : 0;
  const margin = jual > 0 ? laba / jual * 100 : 0;
  const markup = (hpp > 0 && jual > 0) ? laba / hpp * 100 : 0;
  const foodCost = (jual > 0 && porsiEf > 0) ? (bahanRp / porsiEf) / jual * 100 : 0;
  const lengkap = porsi > 0 && total > 0 && jual > 0;
  return { items, bahanRp, opsList, opsRp, total, porsi, porsiEf, basis, kali,
           bahanPerPorsi: porsiEf > 0 ? bahanRp / porsiEf : 0,
           opsPerPorsi:   porsiEf > 0 ? opsRp / porsiEf : 0,
           hpp, jual, laba, margin, markup, foodCost, lengkap,
           labaBatch: jual > 0 ? (jual * porsiEf) - total : 0 };
}

/* ===================================================================
   KEBUTUHAN BAHAN & BELANJA
   Dari resep per porsi menjadi "berapa yang harus dibeli" untuk N porsi.
   =================================================================== */
/* 2.500 gr lebih enak dibaca sebagai 2,5 kg. Hanya naik tingkat kalau
   angkanya memang besar — 800 gr tetap ditulis 800 gr. */
function satuanEnak(jumlah, satuan) {
  const s = SAT[satuan];
  if (!s) return { n: jumlah, s: satuan };
  if (s.fam === 'berat'  && satuan === 'gr' && Math.abs(jumlah) >= 1000) return { n: jumlah/1000, s:'kg' };
  if (s.fam === 'volume' && satuan === 'ml' && Math.abs(jumlah) >= 1000) return { n: jumlah/1000, s:'l'  };
  return { n: jumlah, s: satuan };
}
const teksJumlah = (jumlah, satuan) => { const e = satuanEnak(jumlah, satuan); return `${fmtN(e.n, 2)} ${e.s}`; };

/* Daftar belanja untuk sejumlah porsi.
   Biaya mengikuti HPP, jadi total modal selalu sama dengan HPP x porsi —
   tidak ada angka yang berdiri sendiri dan bisa berbeda. */
function rencanaBelanja(p, porsiTarget) {
  const h = hitung(p);
  const target = Math.max(num(porsiTarget), 0);
  const perPorsi = h.porsiEf > 0 ? target / h.porsiEf : 0;   // berapa kali resep satu batch

  const baris = h.items.map(i => {
    const b = S.bahan[i.bahanId] || {};
    const butuh = i.jumlahBatch * perPorsi;                  // dalam satuan baris
    const isiKemasan = num(b.isi) * (SAT[b.satuan] ? SAT[b.satuan].f : 0);
    const butuhDasar = butuh * (SAT[i.satuan] ? SAT[i.satuan].f : 0);
    const kemasan = isiKemasan > 0 ? butuhDasar / isiKemasan : 0;
    const beliKemasan = Math.ceil(kemasan - 1e-9);
    // Satuan pcs tidak bisa dibeli separuh — sachet, cup, sendok.
    const pecahan = i.satuan === 'pcs' && Math.abs(butuh - Math.round(butuh)) > 1e-9;
    return {
      id: i.bahanId, nama: b.nama || 'Bahan tidak ditemukan', satuan: i.satuan,
      butuh, pecahan, bulat: Math.ceil(butuh - 1e-9),
      kemasan, beliKemasan, isiKemasan, satuanKemasan: b.satuan,
      rp: i.rpTulis * (h.kali * perPorsi), err: i.err,
    };
  });
  const bahanRp = h.bahanPerPorsi * target;
  const opsRp   = h.opsPerPorsi * target;
  return { h, target, baris, bahanRp, opsRp,
           modal: bahanRp + opsRp,
           omzet: h.jual * target,
           laba: (h.jual * target) - (bahanRp + opsRp),
           batch: h.porsiEf > 0 ? target / h.porsiEf : 0,
           adaPecahan: baris.some(b => b.pecahan) };
}
/* Harga jual dari target margin (persen dari harga jual, bukan dari modal). */
const hargaDariMargin = (hpp, m) => { const x = clamp(num(m),0,95)/100; return hpp / (1 - x); };
const hargaDariMarkup = (hpp, m) => hpp * (1 + clamp(num(m),0,500)/100);
const bulatkanAtas = (v, step) => { const s = num(step) || 500; return Math.ceil(v / s) * s; };

function statusMargin(h) {
  if (!h.lengkap) return { k:'mute', t:'Belum lengkap' };
  if (h.margin < 0)  return { k:'bad',  t:'Rugi' };
  if (h.margin < 15) return { k:'bad',  t:'Margin tipis' };
  if (h.margin < 25) return { k:'warn', t:'Margin pas-pasan' };
  return { k:'ok', t:'Margin sehat' };
}
function warnaStatus(k) {
  return k === 'ok' ? 'var(--baik)' : k === 'warn' ? 'var(--hati)' : k === 'bad' ? 'var(--kritis)' : 'var(--tinta-3)';
}

/* Pemeriksaan yang menangkap kesalahan isi paling sering terjadi. */
function periksa(p, h) {
  const w = [];
  if (!h.porsi) w.push({ k:'bad', t:'<b>Jumlah porsi jadi belum diisi.</b> Tanpa itu HPP per porsi tidak bisa dihitung.' });

  // Bahan satuan pcs biasanya habis satu per porsi (cup, sendok, sachet).
  // Kalau jumlahnya beda jauh dari porsi jadi, salah satunya pasti salah isi.
  const pcsItems = h.items.filter(i => i.satuan === 'pcs' && !i.err && num(i.jumlah) > 0);

  // Takaran yang ditulis adalah untuk satu porsi. Kalau angkanya justru
  // sebesar jumlah porsi, kemungkinan besar takaran sebatch yang tersalin.
  if (h.porsi > 1 && pcsItems.length) {
    const mirip = pcsItems.filter(i => Math.round(num(i.jumlah)) === Math.round(h.porsi));
    if (mirip.length) {
      const nama = mirip.map(i => (S.bahan[i.bahanId] || {}).nama).filter(Boolean);
      w.push({ k:'warn', t:
        `<b>Sepertinya ini takaran satu batch, bukan satu porsi.</b> ${esc(nama.join(', '))} ditulis ` +
        `<b>${Math.round(h.porsi)} pcs per porsi</b> — sama persis dengan jumlah porsi jadi. ` +
        `Kalau maksudnya satu per porsi, isi <b>1</b> saja; aplikasi yang mengalikan ke ${Math.round(h.porsi)}.` });
    }
    const pecah = pcsItems.filter(i => Math.abs(num(i.jumlah) - Math.round(num(i.jumlah))) > 1e-9);
    if (pecah.length) {
      const nama = pecah.map(i => (S.bahan[i.bahanId] || {}).nama).filter(Boolean);
      w.push({ k:'info', t:
        `<b>Takaran pecahan pada barang hitungan.</b> ${esc(nama.join(', '))} ditulis tidak bulat. ` +
        `Itu wajar untuk bahan yang dibagi (satu sachet untuk dua porsi), tapi cek daftar belanja — ` +
        `jumlah belinya dibulatkan ke atas.` });
    }
  }
  // Waktu operasional yang jauh lebih panjang dari masuk akal per porsi biasanya
  // sisa dari batch lama yang jumlah porsinya lebih besar. Diminta dicek, bukan
  // dituduh salah — masakan yang direbus lama memang bisa begitu.
  const lama = (h.opsList || []).filter(o =>
    (o.mode === 'listrik' || o.mode === 'jam') && h.porsiEf > 0 && num(o.menit) / h.porsiEf > 40);
  if (lama.length) {
    const o = lama[0];
    w.push({ k:'warn', t:
      `<b>Cek waktu pada “${esc(o.nama || 'biaya operasional')}”.</b> Tertulis ${fmtN(num(o.menit),0)} menit untuk satu batch ` +
      `berisi ${fmtN(h.porsiEf,0)} porsi — berarti <b>${fmtN(num(o.menit)/h.porsiEf,0)} menit per porsi</b>. ` +
      `Kalau itu sisa dari batch yang dulu lebih besar, betulkan ke waktu sebenarnya: biaya ${rp(o.rp)} ini ikut menaikkan HPP.` });
  }

  if (h.items.length && h.opsRp === 0)
    w.push({ k:'info', t:'<b>Biaya operasional masih kosong.</b> Gas, listrik, dan tenaga kerja belum ikut dihitung, jadi HPP ini lebih rendah dari kenyataan.' });
  if (!h.jual)
    w.push({ k:'info', t:'Harga jual belum diisi, jadi laba dan margin belum bisa dihitung.' });
  if (h.lengkap && h.margin < 0)
    w.push({ k:'bad', t:`<b>Harga jual di bawah HPP.</b> Tiap porsi rugi ${rp(Math.abs(h.laba))} — satu batch rugi ${rp(Math.abs(h.labaBatch))}.` });
  else if (h.lengkap && h.margin < 15)
    w.push({ k:'warn', t:`<b>Margin ${pct(h.margin)} terlalu tipis.</b> Sekali bahan naik harga atau ada yang terbuang, produk ini langsung rugi.` });
  /* Patokan "bahan 30–35%" dibuat untuk usaha yang membayar sewa tempat dan
     gaji karyawan. Usaha rumahan tidak punya pos itu, jadi bahan boleh memakan
     porsi lebih besar tanpa berarti ada yang salah. Yang tetap perlu dikatakan
     adalah risikonya: bahan sebesar itu tidak menyisakan bantalan. */
  if (h.lengkap && h.foodCost > 40) {
    const opsBagian = h.jual > 0 ? h.opsPerPorsi / h.jual * 100 : 0;
    const rumahan = opsBagian < 10;
    const naik20 = h.bahanPerPorsi * 1.2 + h.opsPerPorsi;
    const marginNaik = (h.jual - naik20) / h.jual * 100;

    // Satu bahan yang memegang sebagian besar biaya = satu titik rapuh.
    const urut = h.items.filter(i => i.rp > 0).sort((a,b) => b.rp - a.rp);
    const utama = urut[0];
    const bagianUtama = (utama && h.bahanRp > 0) ? utama.rp / h.bahanRp * 100 : 0;
    const tUtama = (utama && bagianUtama >= 40)
      ? ` Yang paling menentukan <b>${esc((S.bahan[utama.bahanId] || {}).nama || 'bahan utama')}</b> — ${pct(bagianUtama)} dari biaya bahan, jadi harganya yang paling perlu dipantau.`
      : '';

    w.push(rumahan ? { k:'info', t:
      `<b>Biaya bahan ${pct(h.foodCost)} dari harga jual.</b> Patokan umum usaha makanan 30–35%, tapi patokan itu untuk ` +
      `usaha yang membayar sewa tempat dan gaji karyawan. Operasionalmu baru ${pct(opsBagian)} dari harga jual, jadi ` +
      `susunan ini wajar untuk usaha rumahan. Risikonya ada di satu hal: tidak ada bantalan kalau bahan naik — ` +
      `naik 20% saja margin turun dari ${pct(h.margin)} ke ${pct(marginNaik)}.${tUtama}` }
    : { k:'warn', t:
      `<b>Biaya bahan ${pct(h.foodCost)} dari harga jual.</b> Patokan umum usaha makanan 30–35%, dan operasionalmu ` +
      `sudah ${pct(opsBagian)}, jadi sisa untuk laba jadi tipis. Bahan naik 20% → margin ${pct(h.margin)} turun ke ` +
      `${pct(marginNaik)}.${tUtama}` });
  }

  /* Margin tebal pada usaha yang dikerjakan sendiri hampir selalu karena waktu
     kerja belum masuk hitungan. Lebih baik diketahui sekarang daripada saat
     sudah terlanjur menyewa tempat atau menggaji orang. */
  const adaUpah = (p.ops || []).some(o => o.mode === 'jam' && num(o.menit) > 0);
  if (h.lengkap && !adaUpah && h.margin > 30) {
    const upah5 = num(S.setel.upahJam) / 60 * 5;
    const hpp5 = h.hpp + upah5;
    w.push({ k:'info', t:
      `<b>Waktu kerjamu belum ikut dihitung.</b> Margin ${pct(h.margin)} itu belum memotong tenaga sendiri. ` +
      `Tambahkan baris operasional bermode “Tenaga kerja”: kalau 5 menit per porsi, HPP jadi ${rp(hpp5)} ` +
      `dan margin ${pct((h.jual - hpp5) / h.jual * 100)}. Angka itu yang berlaku begitu pekerjaannya diserahkan ke orang lain.` });
  }
  return w;
}

/* ===================================================================
   PENYIMPANAN — tulis ditunda supaya tidak menyimpan tiap ketukan tombol
   =================================================================== */
/* Catat dokumen mana yang berubah, supaya yang dikirim ke cloud hanya itu —
   bukan seluruh data setiap kali satu angka diketik. */
const kotor = { produk:new Set(), bahan:new Set(), setel:false, buangProduk:new Set(), buangBahan:new Set() };
function simpan(jenis, id) {
  if (!S.boleh) return;
  if (jenis === 'produk' && id) kotor.produk.add(id);
  else if (jenis === 'bahan' && id) kotor.bahan.add(id);
  else if (jenis === 'setel') kotor.setel = true;
  jadwalSimpan();
}
const simpanProduk = p => simpan('produk', p && p.id);
const simpanBahan  = b => simpan('bahan',  b && b.id);
const simpanSetel  = () => simpan('setel');
function tandaiHapus(jenis, id) {
  if (jenis === 'produk') { kotor.buangProduk.add(id); kotor.produk.delete(id); }
  else { kotor.buangBahan.add(id); kotor.bahan.delete(id); }
  jadwalSimpan();
}

/* ===================================================================
   KOMPONEN GRAFIK
   =================================================================== */
/* Batang perbandingan. Skala dibagi bersama; nilai minus tumbuh ke kiri dari garis nol. */
function batangHTML(items, opt) {
  opt = opt || {};
  if (!items.length) return '';
  const nilai = items.map(i => i.value);
  // Target ikut menentukan rentang: tanpa ini, target di luar nilai tertinggi
  // akan terjepit di ujung dan terlihat seolah hampir tercapai.
  const extra = opt.target != null ? [opt.target] : [];
  const lo = Math.min(0, ...nilai, ...extra), hi = Math.max(0, ...nilai, ...extra);
  const rentang = (hi - lo) || 1;
  const nolPos = (0 - lo) / rentang * 100;
  const adaMinus = lo < 0;
  const tgtPos = opt.target != null ? clamp((opt.target - lo) / rentang * 100, 0, 100) : null;

  const baris = items.map(i => {
    const v = clamp((i.value - lo) / rentang * 100, 0, 100);
    const kiri = Math.min(v, nolPos), lebar = Math.max(Math.abs(v - nolPos), i.value === 0 ? 0 : 1.2);
    const kelas = 'hb-track' + (adaMinus ? ' zero' : '') + (tgtPos != null ? ' tgt' : '');
    const gaya = `--zero:${nolPos}%` + (tgtPos != null ? `;--tgt:${tgtPos}%` : '');
    return `<div class="hb">
      <span class="hb-lab"><span>${i.emoji ? i.emoji + ' ' : ''}${esc(i.label)}</span></span>
      <div class="${kelas}" style="${gaya}"><i style="left:${kiri}%;width:${lebar}%;background:${i.color}"></i></div>
      <span class="hb-end"><b class="hb-val">${esc(i.text)}</b>${i.chip || ''}</span>
    </div>`;
  }).join('');
  const cap = opt.caption ? `<p class="cap">${opt.caption}</p>` : '';
  return `<div class="hbars">${baris}</div>${cap}`;
}

/* Donat komposisi biaya. Tiap irisan diberi jeda 2px agar batasnya terbaca. */
function donatHTML(slices) {
  const total = slices.reduce((s,x) => s + x.value, 0);
  if (total <= 0) return '';
  const r = 46, lebar = 22, C = 2 * Math.PI * r;
  let off = 0;
  const arcs = slices.map(s => {
    const len = s.value / total * C;
    const jeda = slices.length > 1 ? 2 : 0;
    const a = `<circle cx="60" cy="60" r="${r}" fill="none" stroke="${s.color}" stroke-width="${lebar}"
      stroke-dasharray="${Math.max(len - jeda, 0.5)} ${C - Math.max(len - jeda, 0.5)}"
      stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"><title>${esc(s.label)}: ${rp(s.value)}</title></circle>`;
    off += len;
    return a;
  }).join('');
  const legend = slices.map(s => `<span class="it">
      <span class="sw" style="background:${s.color}"></span>
      <span class="nm">${esc(s.label)}</span>
      <b>${rp(s.value)} · ${pct(s.value/total*100)}</b>
    </span>`).join('');
  return `<div class="donut-wrap">
    <svg class="chart" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Komposisi biaya produksi">${arcs}</svg>
    <div class="legend">${legend}</div>
  </div>`;
}

/* ===================================================================
   TAMPILAN: RINGKASAN
   =================================================================== */
function daftarProduk() {
  return Object.values(S.produk).sort((a,b) => (a.urutan||0) - (b.urutan||0) || String(a.nama).localeCompare(String(b.nama)));
}

          <div style="margin-top:18px"><button class="btn primary" data-aksi="produk-baru">Buat produk pertama</button></div>

      <div class="d">${draf.length ? draf.length + ' produk belum diisi' : 'Semua produk sudah terisi'}</div></div>
    <div class="tile ${marginRata>=25?'ok':marginRata>=15?'warn':'bad'}"><div class="k">Margin rata-rata</div>

  </div>`;

  let grafik = '';
  if (siap.length) {
    const urutLaba = siap.slice().sort((a,b) => b.h.laba - a.h.laba);
    const labaItems = urutLaba.map(r => {
      const st = statusMargin(r.h);
      return { label:r.p.nama, emoji:r.p.emoji, value:r.h.laba, color:'var(--s1)', text:rp(r.h.laba),
               chip:`<span class="chip ${st.k}"><span class="dot"></span>${st.t}</span>` };
    });
    const urutMargin = siap.slice().sort((a,b) => b.h.margin - a.h.margin);
    const marginItems = urutMargin.map(r => {
      const st = statusMargin(r.h);
      return { label:r.p.nama, emoji:r.p.emoji, value:r.h.margin, color:warnaStatus(st.k), text:pct(r.h.margin),
               chip:`<span class="chip ${st.k}"><span class="dot"></span>${st.t}</span>` };
    });
    grafik = `<div class="dua">
      <div class="card">
        <div class="sec-head" style="margin-bottom:16px">
          <div><h2>Laba per porsi</h2><p class="sub">Harga jual dikurangi HPP, untuk satu porsi.</p></div>

        </div>

  }

  const tabel = `<div class="card">
    <div class="sec-head" style="margin-bottom:14px"><h2>Produk yang sudah diisi</h2>
      <button class="btn ghost" data-aksi="produk-baru">+ Produk</button></div>
    ${diisi.length ? `<div class="tbl-wrap"><table>
      <thead><tr><th>Produk</th><th>HPP / porsi</th><th>Harga jual</th><th>Laba</th><th>Margin</th><th>Biaya bahan</th><th>Status</th></tr></thead>
      <tbody>${diisi.map(({p,h}) => {
        const st = statusMargin(h);
        return `<tr data-buka="${esc(p.id)}" style="cursor:pointer">
          <td><span class="pname"><span class="em">${p.emoji || '🍽️'}</span><b>${esc(p.nama || 'Tanpa nama')}</b></span></td>
          <td class="num">${h.porsi ? rp(h.hpp) : '—'}</td>
          <td class="num">${h.jual ? rp(h.jual) : '—'}</td>
          <td class="num">${h.lengkap ? rp(h.laba) : '—'}</td>
          <td class="num">${h.lengkap ? pct(h.margin) : '—'}</td>
          <td class="num">${h.lengkap ? pct(h.foodCost) : '—'}</td>
          <td><span class="chip ${st.k}"><span class="dot"></span>${st.t}</span></td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>` : `<div class="empty" style="padding:20px 0">Belum ada produk yang diisi datanya.</div>`}
    ${draf.length ? `<div style="margin-top:18px;border-top:1px dashed var(--garis-kuat);padding-top:16px">
      <p class="eyebrow" style="margin-bottom:10px">Menunggu diisi · ${draf.length} produk</p>
      <div class="quick-chips" style="display:flex;flex-wrap:wrap;gap:7px">
        ${draf.map(({p}) => `<button class="btn ghost" style="padding:7px 12px;font-weight:600" data-buka="${esc(p.id)}">
          ${p.emoji || '🍽️'} ${esc(p.nama || 'Tanpa nama')}</button>`).join('')}
      </div></div>` : ''}
  </div>`;

  const semuaCatatan = diisi.flatMap(({p}) => (notes.get(p.id)||[])
    .filter(n => n.k === 'bad' || n.k === 'warn')
    .map(n => Object.assign({}, n, { nama:p.nama, id:p.id })));
  const catatan = semuaCatatan.length ? `<div class="card">
      <div class="sec-head" style="margin-bottom:14px"><h2>Perlu dicek</h2>
        <span class="sub">${semuaCatatan.length} catatan</span></div>
      <div class="notes">${semuaCatatan.slice(0,8).map(n => `
        <div class="note ${n.k}"><span class="ic">${n.k==='bad'?'⚠️':'💡'}</span>
          <span><b>${esc(n.nama)}</b> — ${n.t}</span></div>`).join('')}</div>
    </div>` : (diisi.length ? `<div class="card"><div class="note ok"><span class="ic">✅</span>
      <span>Semua produk yang sudah diisi berada di margin yang aman.</span></div></div>` : '');

  el.innerHTML = `<div class="sec">
    <div class="sec-head"><div><h1>Ringkasan</h1>
      <p class="sub">${siap.length} dari ${semua.length} produk sudah bisa dinilai.</p></div></div>
    ${tiles}${grafik}${tabel}${catatan}
  </div>`;
}

function renderProduk() {
  const el = $('#v-produk');
  if (S.editId && S.produk[S.editId]) { el.innerHTML = editorHTML(S.produk[S.editId]); return; }
  S.editId = null;

  const semua = daftarProduk();
  if (!semua.length) {
    el.innerHTML = `<div class="sec"><div class="sec-head"><h1>Produk</h1>
      <button class="btn primary" data-aksi="produk-baru">+ Produk baru</button></div>
      <div class="card"><div class="empty"><b>Belum ada produk</b>
        Setiap produk berisi daftar bahan, biaya operasional, dan jumlah porsi jadi.</div></div></div>`;
    return;
  }

  const kartu = semua.map(p => {
    const h = hitung(p), st = statusMargin(h);
    const bagiHpp = h.jual > 0 ? clamp(h.hpp / h.jual * 100, 0, 100) : 100;
    return `<button class="pcard" data-buka="${esc(p.id)}">
      <span class="top"><span class="em">${p.emoji || '🍽️'}</span>
        <span class="nm">${esc(p.nama || 'Tanpa nama')}</span></span>
      <span class="mini"><span>HPP / porsi</span><b>${h.porsi ? rp(h.hpp) : '—'}</b></span>
      <span class="mini"><span>Harga jual</span><b>${h.jual ? rp(h.jual) : '—'}</b></span>
      <span class="bar-mini">
        <i style="width:${bagiHpp}%;background:var(--tinta-3)"></i>
        <i style="width:${100-bagiHpp}%;background:${warnaStatus(st.k)}"></i>
      </span>
      <span class="mini"><span class="chip ${st.k}"><span class="dot"></span>${st.t}</span>
        <b>${h.lengkap ? pct(h.margin) : ''}</b></span>
    </button>`;
  }).join('');

  el.innerHTML = `<div class="sec">
    <div class="sec-head"><div><h1>Produk</h1>
      <p class="sub">Batang abu-abu bagian HPP, batang berwarna bagian laba.</p></div>
      <button class="btn primary" data-aksi="produk-baru">+ Produk baru</button></div>
    ${kotakCariHTML('cariProduk', 'Cari produk…', semua.length)}
    <div class="pgrid">${kartu}</div>
    <div class="card" data-cari-kosong="produk" hidden><div class="empty"></div></div>
  </div>`;
}

/* Teks kecil di bawah angka biaya. Pada basis "porsi" dengan lebih dari satu
   porsi, di sinilah hasil perkaliannya terlihat tanpa pindah layar. */
function ketBiaya(it, h) {
  if (!h || h.kali <= 1) return h && h.basis === 'porsi' ? 'per porsi' : 'per batch';
  return `${teksJumlah(num(it.jumlah) * h.kali, it.satuan)} · satu batch`;
}
function barisBahanHTML(it, i, h) {
  const b = S.bahan[it.bahanId] || {};
  const dasar = biayaBaris(it);
  const hasil = { rp: dasar.rp * (h ? h.kali : 1), err: dasar.err };
  const satuanOpt = SAT_KEYS.map(k => `<option value="${k}"${k===it.satuan?' selected':''}>${k}</option>`).join('');
  return `<div class="row-i" data-baris="${i}">
    <span class="field" style="min-width:0">
      <div style="font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.nama || 'Bahan tidak ditemukan')}</div>
      <div style="font-size:11px;color:var(--tinta-3)">${b.nama ? rpHalus(hargaDasar(b)) + ' / ' + b.satuan : ''}</div>
    </span>
    <span class="amt-wrap">
      <input class="inp n" data-f="jumlah" inputmode="decimal" value="${esc(fmtIsi(num(it.jumlah)))}" aria-label="Jumlah terpakai" placeholder="jumlah">
      <select class="inp" data-f="satuan" aria-label="Satuan">${satuanOpt}</select>
    </span>
    <span class="cost">${rp(hasil.rp)}<small>${hasil.err ? '' : esc(ketBiaya(it, h))}</small></span>
    <button class="del" data-hapus-bahan="${i}" aria-label="Hapus baris">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 7h14M9.5 7V5h5v2M7 7l1 13h8l1-13"/></svg>
    </button>
    ${hasil.err ? `<span class="row-note">⚠️ ${esc(hasil.err)}</span>` : ''}
  </div>`;
}

/* Dua kolom angka per baris. Tiap cara hitung mengisi keduanya dengan apa
   yang memang perlu ditanyakan; yang cuma butuh satu angka mengosongkan sisanya. */
function isianOps(o) {
  // title ikut diisi: begitu kolom terisi, isyarat di dalamnya hilang, jadi
  // arti tiap kotak masih bisa dipastikan dengan menahan kursor di atasnya.
  const kotak = (f, nilai, label, isyarat) =>
    `<input class="inp n" data-f="${f}" inputmode="decimal" value="${esc(fmtIsi(nilai))}" aria-label="${esc(label)}" title="${esc(label)}" placeholder="${esc(isyarat)}">`;
  switch (o.mode) {
    case 'listrik': return kotak('watt', num(o.watt), 'Watt', 'watt') + kotak('menit', num(o.menit), 'Menit', 'menit');
    case 'gas':     return kotak('tungku', num(o.tungku) || 1, 'Jumlah tungku', 'tungku') + kotak('menit', num(o.menit), 'Menit nyala', 'menit');
    case 'jam':     return kotak('tarif', num(o.tarif) || num(S.setel.upahJam), 'Upah per jam', 'per jam') + kotak('menit', num(o.menit), 'Menit', 'menit');
    case 'air':     return kotak('liter', num(o.liter), 'Liter terpakai', 'liter') + '<span></span>';
    case 'bulanan': return kotak('sebulan', num(o.sebulan), 'Biaya sebulan', 'per bulan') + '<span></span>';
    case 'susut':   return kotak('harga', num(o.harga), 'Harga alat', 'harga') + kotak('bulan', num(o.bulan), 'Umur pakai dalam bulan', 'bulan');
    default:        return kotak('rp', num(o.rp), 'Biaya', 'rupiah') + '<span></span>';
  }
}

function barisOpsHTML(o, i) {
  const biaya = biayaOps(o);
  const modeOpt = OPS_URUT.map(k =>
    `<option value="${k}"${k === o.mode ? ' selected' : ''}>${OPS_MODE[k].ikon} ${OPS_MODE[k].nama}</option>`).join('');
  const isian = isianOps(o);
  const ket = ketOps(o);
  return `<div class="row-i" data-ops="${i}">
    <span class="field" style="min-width:0">
      <input class="inp" data-f="nama" value="${esc(o.nama||'')}" placeholder="Nama biaya" aria-label="Nama biaya" style="margin-bottom:6px">
      <select class="inp" data-f="mode" aria-label="Cara hitung">${modeOpt}</select>
    </span>
    <span class="amt-wrap">${isian}</span>
    <span class="cost">${rp(biaya)}<small>${esc(ket)}</small></span>
    <button class="del" data-hapus-ops="${i}" aria-label="Hapus baris">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 7h14M9.5 7V5h5v2M7 7l1 13h8l1-13"/></svg>
    </button>
  </div>`;
}

/* ===================================================================
   KARTU "MAU BIKIN BERAPA"
   Pertanyaan yang benar-benar dibawa ke pasar: untuk sekian porsi,
   belanjanya apa saja, berapa modalnya, dan berapa baliknya.
   =================================================================== */
const rencanaAktif = (p, h) => num(p.rencana) || h.porsiEf || 1;

function belanjaHTML(p, h) {
  if (!(p.bahan || []).length) return '';
  return `<div class="card" id="belanja">
    <div class="sec-head" style="margin-bottom:4px">
      <div><h2>Mau bikin berapa?</h2>
        <p class="sub">Kebutuhan bahan dan modal untuk sekali produksi.</p></div>
    </div>
    <div class="bl-input">
      <input class="inp n" id="e-rencana" data-p="rencana" inputmode="decimal"
             value="${esc(fmtN(rencanaAktif(p, h), 0))}" aria-label="Jumlah porsi yang mau dibuat">
      <span class="sat">porsi</span>
    </div>
    <div id="belanjaIsi">${belanjaIsiHTML(p, h)}</div>
  </div>`;
}

/* Bagian yang berubah saat angka porsi diketik. Dipisah dari kolom isian
   supaya mengetik tidak menggambar ulang kotak yang sedang diketik. */
function belanjaIsiHTML(p, h) {
  const bawaan = rencanaAktif(p, h);
  const r = rencanaBelanja(p, bawaan);

  // Kelipatan batch — angka yang memang dipikirkan pemilik warung.
  const cepat = [...new Set([h.porsiEf, h.porsiEf*2, h.porsiEf*5, h.porsiEf*10])]
    .filter(n => n > 0 && n <= 100000).slice(0, 4);

  const baris = r.baris.map(b => `
    <div class="bl-row${b.err ? ' err' : ''}">
      <span class="nm">${esc(b.nama)}</span>
      <span class="bt">${b.err ? '—' : esc(teksJumlah(b.butuh, b.satuan))}${
        b.pecahan ? `<small>bulatkan ${fmtN(b.bulat,0)} ${esc(b.satuan)}</small>` : ''}</span>
      <span class="bl">${b.err || !(b.beliKemasan > 0)
        ? '<small>—</small>'
        : `${fmtN(b.beliKemasan,0)} ×<small>${esc(fmtN(b.isiKemasan / (SAT[b.satuanKemasan] ? SAT[b.satuanKemasan].f : 1), 2))} ${esc(b.satuanKemasan)}</small>`}</span>
      <span class="rp">${b.err ? '—' : rp(b.rp)}</span>
    </div>`).join('');

  return `
    <div class="bl-cepat">
      ${cepat.map(n => `<button class="chip-cepat${n === Math.round(bawaan) ? ' on' : ''}" data-rencana="${n}">${fmtN(n,0)}</button>`).join('')}
      <span class="bl-batch">${r.batch > 0 ? `= ${fmtN(r.batch, r.batch % 1 ? 2 : 0)} batch` : ''}</span>
    </div>

    <div class="bl-tabel">
      <div class="bl-head"><span>Bahan</span><span>Butuh</span><span>Beli</span><span>Biaya</span></div>
      ${baris}
    </div>

    ${r.adaPecahan ? `<div class="note warn" style="margin-top:12px"><span class="ic">✂️</span><span>
      Ada bahan hitungan yang jumlahnya tidak bulat. Sachet dan cup tidak bisa dibeli separuh —
      beli dibulatkan ke atas, sisanya kepakai produksi berikutnya.</span></div>` : ''}

    <div class="nota" style="margin-top:16px">
      <div class="line"><span>Modal bahan</span><b>${rp(r.bahanRp)}</b></div>
      <div class="line"><span>Operasional</span><b>${rp(r.opsRp)}</b></div>
      <div class="line total"><span>Total modal</span><b>${rp(r.modal)}</b></div>
    </div>
    ${h.jual > 0 ? `<div class="bl-hasil">
      <div><span class="eyebrow">Omzet bila habis</span><b>${rp(r.omzet)}</b></div>
      <div class="${r.laba >= 0 ? 'untung' : 'rugi'}">
        <span class="eyebrow">${r.laba >= 0 ? 'Laba' : 'Rugi'}</span><b>${rp(Math.abs(r.laba))}</b></div>
    </div>` : `<p class="cap" style="margin-top:12px">Isi harga jual untuk melihat omzet dan labanya.</p>`}`;
}

function hasilHTML(p, h) {
  const st = statusMargin(h);
  const target = num(S.setel.targetMargin);
  const idealMargin = h.hpp > 0 ? hargaDariMargin(h.hpp, target) : 0;
  const idealMarkup = h.hpp > 0 ? hargaDariMarkup(h.hpp, target) : 0;
  const praktis = h.hpp > 0 ? bulatkanAtas(idealMargin, S.setel.pembulatan) : 0;
  const marginPraktis = praktis > 0 ? (praktis - h.hpp) / praktis * 100 : 0;

  const slices = h.items.filter(i => i.rp > 0)
    .sort((a,b) => b.rp - a.rp)
    .map((i, idx) => ({ label:(S.bahan[i.bahanId]||{}).nama || 'Bahan', value:i.rp,
                        color:`var(${SERI[Math.min(idx, SERI.length-1)]})` }));
  if (h.opsRp > 0) slices.push({ label:'Operasional', value:h.opsRp, color:'var(--tinta-3)' });

  const bagiHpp = h.jual > 0 ? clamp(h.hpp / h.jual * 100, 0, 100) : 100;
  const tangga = h.lengkap ? `
    <div style="margin-top:18px">
      <div class="stack">
        <i style="width:${bagiHpp}%;background:var(--tinta-3)"></i>
        <i style="width:${100-bagiHpp}%;background:${warnaStatus(st.k)}"></i>
      </div>
      <div class="legend" style="margin-top:10px">
        <span class="it"><span class="sw" style="background:var(--tinta-3)"></span>HPP <b>${rp(h.hpp)}</b></span>
        <span class="it"><span class="sw" style="background:${warnaStatus(st.k)}"></span>Laba <b>${rp(h.laba)}</b></span>
        <span class="it" style="margin-left:auto">Harga jual <b>${rp(h.jual)}</b></span>
      </div>
    </div>` : '';

  return `
  <div class="card">
    <div class="sec-head" style="margin-bottom:14px"><h2>Rincian biaya</h2>
      <span class="sub">${h.porsi ? h.porsi + ' porsi per batch' : 'porsi belum diisi'}</span></div>
    <div class="nota">
      <div class="line"><span>Biaya bahan baku</span><b>${rp(h.bahanRp)}</b></div>
      <div class="line"><span>Biaya operasional</span><b>${rp(h.opsRp)}</b></div>
      <div class="line total"><span>Biaya produksi satu batch</span><b>${rp(h.total)}</b></div>
    </div>
    <div style="margin-top:20px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
      <div><div class="eyebrow">HPP per porsi</div>
        <div class="hero-num">${h.porsi ? rp(h.hpp) : '—'}</div></div>
      ${h.lengkap ? `<span class="chip ${st.k}" style="margin-left:auto"><span class="dot"></span>${st.t} ${pct(h.margin)}</span>` : ''}
    </div>
    ${tangga}
  </div>

  ${belanjaHTML(p, h)}

  <div class="card">
    <div class="sec-head" style="margin-bottom:14px"><h2>Usulan harga jual</h2>
      <span class="sub">target ${pct(target)}</span></div>
    ${h.hpp > 0 ? `
    <div class="nota">
      <div class="line"><span>Margin ${pct(target)} — laba dihitung dari harga jual</span><b>${rp(idealMargin)}</b></div>
      <div class="line"><span>Markup ${pct(target)} — laba dihitung dari modal</span><b>${rp(idealMarkup)}</b></div>
      <div class="line total"><span>Dibulatkan ke ${rp(S.setel.pembulatan)} terdekat</span><b>${rp(praktis)}</b></div>
    </div>
    <div class="note info" style="margin-top:14px"><span class="ic">💡</span>
      <span>Di harga <b>${rp(praktis)}</b> margin nyatanya <b>${pct(marginPraktis)}</b> dan laba <b>${rp(praktis - h.hpp)}</b> per porsi.
      Spreadsheet lama memakai cara <b>margin</b>, jadi angka ${rp(idealMargin)} itu yang sebanding.</span></div>
    <div style="margin-top:14px"><button class="btn ghost" data-pakai-harga="${praktis}">Pakai ${rp(praktis)} sebagai harga jual</button></div>
    ` : `<div class="empty" style="padding:18px 0">Isi bahan dan jumlah porsi dulu.</div>`}
  </div>

  ${slices.length ? `<div class="card">
    <div class="sec-head" style="margin-bottom:16px"><h2>Komposisi biaya</h2>
      <span class="sub">${h.lengkap ? 'bahan ' + pct(h.foodCost) + ' dari harga jual' : 'satu batch'}</span></div>
    ${donatHTML(slices)}
    ${h.lengkap ? `<p class="cap" style="margin-top:16px">Patokan usaha makanan: biaya bahan sehat di kisaran 30–35% dari harga jual.</p>` : ''}
  </div>` : ''}

  ${(() => { const c = periksa(p, h); return c.length ? `<div class="card">
    <div class="sec-head" style="margin-bottom:14px"><h2>Catatan</h2></div>
    <div class="notes">${c.map(n => `<div class="note ${n.k}">
      <span class="ic">${n.k==='bad'?'⚠️':n.k==='warn'?'💡':'ℹ️'}</span><span>${n.t}</span></div>`).join('')}</div>
  </div>` : ''; })()}`;
}

  </div>`;
}

/* ===================================================================
   PENGGAMBARAN UTAMA
   =================================================================== */
/* Mengganti innerHTML sambil kolom isian sedang fokus akan memicu blur, dan handler
   blur bisa memanggil render() lagi di tengah render yang belum selesai — DOM-nya pecah.
   Penjaga ini menolak panggilan bersarang; render terluar yang menyelesaikan tugasnya. */
let sedangRender = false;
function render() {
  if (sedangRender) return;
  sedangRender = true;
  try {
    renderIsi();
  } finally { sedangRender = false; }
  // Saringan dipasang ulang setelah isi digambar, supaya hasil pencarian
  // bertahan walau layar sempat digambar ulang dari sebab lain.
  terapkanCari();
}
function renderIsi() {
  document.querySelectorAll('#tabs button').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)));
  ['ringkasan','produk','bahan'].forEach(v => { $('#v-' + v).hidden = (v !== S.tab); });
  if (S.tab === 'ringkasan') renderRingkasan();
  else if (S.tab === 'produk') renderProduk();
  else renderBahan();
  if (!S.boleh) tempelBanner();
}
/* Saat mengetik, hanya bagian hasil yang digambar ulang — kolom isian tidak
   boleh ikut dibuat ulang, karena fokus dan posisi kursor akan hilang. */
function renderBelanja() {
  const p = S.produk[S.editId];
  if (!p) return;
  const box = $('#belanjaIsi');
  if (box) box.innerHTML = belanjaIsiHTML(p, hitung(p));
}
function renderHasil() {
  const p = S.produk[S.editId];
  if (!p) return;
  const h = hitung(p);
  const box = $('#hasil');
  if (box) box.innerHTML = hasilHTML(p, h);
  document.querySelectorAll('#editor [data-baris]').forEach(el => {
    const i = +el.dataset.baris, it = (p.bahan||[])[i];
    if (!it) return;
    const hasil = biayaBaris(it);
    const c = el.querySelector('.cost');
    if (c) c.innerHTML = `${rp(hasil.rp * h.kali)}<small>${hasil.err ? '' : esc(ketBiaya(it, h))}</small>`;
  });
  document.querySelectorAll('#editor [data-ops]').forEach(el => {
    const i = +el.dataset.ops, o = (p.ops||[])[i];
    if (!o) return;
    const c = el.querySelector('.cost');
    if (c) c.innerHTML = `${rp(biayaOps(o))}<small>${esc(ketOps(o))}</small>`;
  });
}
function tempelBanner() {
  if (document.getElementById('banner')) return;
  const d = document.createElement('div');
  d.id = 'banner'; d.className = 'card';
  d.style.cssText = 'margin:14px 0 0';
  d.innerHTML = `<div class="note warn"><span class="ic">🔒</span><span>
    <b>Penyimpanan diblokir.</b> Peramban ini tidak mengizinkan penyimpanan lokal (mode penyamaran?), jadi perubahan hilang saat halaman ditutup.</span></div>`;
  const app = $('#app'); if (app) app.insertBefore(d, app.firstChild);
}

function produkBaru() {
  const id = uid();
  const urutan = Object.keys(S.produk).length + 1;
  // Produk baru memakai basis "porsi": menulis takaran satu porsi lebih alami,
  // dan jumlah porsi tinggal diubah tanpa menghitung ulang bahannya.
  const p = { id, nama:'', emoji:'🍽️', porsi:0, hargaJual:0, basis:'porsi', bahan:[], ops:[], urutan };
  S.produk[id] = p; simpanProduk(p);
  S.cariProduk = '';          // kalau tidak, baris baru yang masih tanpa nama langsung tersaring
  S.tab = 'produk'; S.editId = id; render();
  setTimeout(() => { const n = $('#e-nama'); if (n) n.focus(); }, 60);
}
function bahanBaru(fokus) {
  const id = uid();
  const b = { id, nama:'', isi:0, satuan:'gr', harga:0 };
  S.bahan[id] = b; simpanBahan(b);
  S.cariBahan = '';           // kalau tidak, baris baru yang masih tanpa nama langsung tersaring
  if (fokus) { S.tab = 'bahan'; render();
    setTimeout(() => { const el = document.querySelector(`[data-bahan="${id}"] [data-f="nama"]`); if (el) el.focus(); }, 60); }
  return b;
}
function tambahBarisBahan(bahanId) {
  const p = S.produk[S.editId]; if (!p) return;
  const b = S.bahan[bahanId];
  p.bahan = (p.bahan || []).concat([{ bahanId, jumlah:0, satuan:(b && b.satuan) || 'gr' }]);
  simpanProduk(p); render();
}
/* Baris baru langsung lahir dengan cara hitung yang dipilih dan nama bawaan,
   jadi tidak perlu mengubah dropdown setiap kali menambah biaya. */
function tambahBarisOps(mode) {
  const p = S.produk[S.editId]; if (!p) return;
  const m = OPS_MODE[mode] ? mode : 'rp';
  const baris = { nama: m === 'rp' ? '' : OPS_MODE[m].nama, mode:m,
                  rp:0, watt:0, menit:0, tungku:1, liter:0, sebulan:0, harga:0, bulan:0 };
  if (m === 'jam') baris.tarif = num(S.setel.upahJam);
  p.ops = (p.ops || []).concat([baris]);
  simpanProduk(p); render();
  setTimeout(() => {
    const el = document.querySelector('#editor [data-ops]:last-of-type .inp.n');
    if (el) { el.focus(); el.select && el.select(); }
  }, 60);
}

/* Tanpa dialog bawaan peramban: tombol hapus minta tekan dua kali. */
const tungguKonfirmasi = new WeakMap();
function konfirmasi(btn, teks, fn) {
  if (tungguKonfirmasi.get(btn)) { clearTimeout(tungguKonfirmasi.get(btn)); tungguKonfirmasi.delete(btn); fn(); return; }
  const asli = btn.innerHTML;
  btn.innerHTML = teks;
  btn.classList.add('danger');
  tungguKonfirmasi.set(btn, setTimeout(() => {
    tungguKonfirmasi.delete(btn);
    if (btn.isConnected) { btn.innerHTML = asli; btn.classList.remove('danger'); }
  }, 3500));
}

document.addEventListener('click', e => {
  const t = e.target;

  const tab = t.closest('#tabs button');
  if (tab) { S.tab = tab.dataset.tab; if (S.tab !== 'produk') S.editId = null; render(); return; }
  if (t.closest('#btnSetel')) { sheetPengaturan(); return; }

  const aksi = t.closest('[data-aksi]');
  if (aksi) {
    const a = aksi.dataset.aksi;
    if (a === 'tutup-sheet') tutupSheet();
    else if (a === 'export') unduhBackup();
    else if (a === 'import') { const f = $('#fileBackup'); if (f) f.click(); }
    else if (a === 'produk-baru') produkBaru();
    else if (a === 'bahan-baru') bahanBaru(true);
    else if (a === 'bahan-baru-dari-produk') { const b = bahanBaru(false); tutupSheet(); tambahBarisBahan(b.id);
      setTimeout(() => { const el = document.querySelector('#editor [data-baris]:last-of-type'); if (el) el.scrollIntoView({block:'center'}); }, 60); }
    else if (a === 'tutup-editor') { S.editId = null; render(); }
    else if (a === 'tambah-bahan') sheetPilihBahan();
    else if (a === 'tambah-ops') sheetPilihOps();
    else if (a === 'hapus-produk') konfirmasi(aksi, 'Tekan lagi untuk hapus', () => {
      const id = S.editId; if (!id) return;
      delete S.produk[id]; tandaiHapus('produk', id); S.editId = null; render();
    });
    return;
  }

  const rc = t.closest('[data-rencana]');
  if (rc) { const p = S.produk[S.editId]; if (!p) return;
    p.rencana = num(rc.dataset.rencana); simpanProduk(p); renderHasil(); return; }

  const hc = t.closest('[data-hapus-cari]');
  if (hc) {
    S[hc.dataset.hapusCari] = '';
    const kotak = document.querySelector(`[data-cari="${hc.dataset.hapusCari}"]`);
    if (kotak) { kotak.value = ''; kotak.focus(); }
    terapkanCari();
    return;
  }

  const ob = t.closest('[data-ops-baru]');
  if (ob) { tutupSheet(); tambahBarisOps(ob.dataset.opsBaru); return; }

  const pilih = t.closest('[data-pilih]');
  if (pilih) { tutupSheet(); tambahBarisBahan(pilih.dataset.pilih); return; }

  const buka = t.closest('[data-buka]');
  if (buka) { S.tab = 'produk'; S.editId = buka.dataset.buka; render(); window.scrollTo({ top:0, behavior:'smooth' }); return; }

  const pakai = t.closest('[data-pakai-harga]');
  if (pakai) {
    const p = S.produk[S.editId]; if (!p) return;
    p.hargaJual = num(pakai.dataset.pakaiHarga);
    simpanProduk(p); render(); return;
  }

  const hb = t.closest('[data-hapus-bahan]');
  if (hb) { const p = S.produk[S.editId]; if (!p) return;
    p.bahan.splice(+hb.dataset.hapusBahan, 1); simpanProduk(p); render(); return; }

  const ho = t.closest('[data-hapus-ops]');
  if (ho) { const p = S.produk[S.editId]; if (!p) return;
    p.ops.splice(+ho.dataset.hapusOps, 1); simpanProduk(p); render(); return; }

  const hp = t.closest('[data-hapus-pustaka]');
  if (hp) {
    const id = hp.dataset.hapusPustaka;
    const dipakai = Object.values(S.produk).filter(p => (p.bahan||[]).some(i => i.bahanId === id)).length;
    konfirmasi(hp, dipakai ? `Dipakai di ${dipakai} produk — tekan lagi` : 'Tekan lagi untuk hapus', () => {
      delete S.bahan[id]; tandaiHapus('bahan', id); render();
    });
    return;
  }
});

/* Mengetik: perbarui keadaan, lalu gambar ulang hanya bagian hasil. */
document.addEventListener('input', e => {
  const t = e.target;
  if (!t.matches('input, select')) return;

  if (t.dataset.cari) {                                 // kotak pencarian
    S[t.dataset.cari] = t.value;
    terapkanCari();
    return;
  }

  if (t.dataset.s) {                                    // pengaturan
    S.setel[t.dataset.s] = t.dataset.s === 'pembulatan' ? num(t.value) : num(t.value);
    simpanSetel();
    if (S.editId) renderHasil();
    return;
  }
  if (t.dataset.p) {                                    // kolom produk
    const p = S.produk[S.editId]; if (!p) return;
    p[t.dataset.p] = (t.dataset.p === 'nama' || t.dataset.p === 'emoji') ? t.value : num(t.value);
    simpanProduk(p);
    // "Mau bikin berapa" hanya mengubah daftar belanja, bukan HPP. Digambar
    // terpisah supaya kotak yang sedang diketik tidak ikut dibongkar.
    if (t.dataset.p === 'rencana') renderBelanja(); else renderHasil();
    return;
  }
  const baris = t.closest('[data-baris]');
  if (baris) { const p = S.produk[S.editId]; if (!p) return;
    const it = p.bahan[+baris.dataset.baris]; if (!it) return;
    it[t.dataset.f] = t.dataset.f === 'satuan' ? t.value : num(t.value);
    simpanProduk(p); renderHasil(); return; }

  const ops = t.closest('[data-ops]');
  if (ops) { const p = S.produk[S.editId]; if (!p) return;
    const o = p.ops[+ops.dataset.ops]; if (!o) return;

/* Ubah resep bertakaran satu batch menjadi takaran satu porsi.
   Takaran dibagi jumlah porsi, jadi biaya satu batch — dan karenanya HPP per
   porsi — keluar sama persis seperti sebelumnya. Hanya cara menulisnya yang
   berubah, bukan angkanya. */
function keBasisPorsi(p) {
  if (p.basis === 'porsi') return false;          // sudah per porsi, jangan disentuh lagi
  // basis:'batch' DAN produk tanpa field basis sama-sama berarti takaran sebatch.
  const porsi = Math.max(num(p.porsi), 0);
  if (porsi > 1 && (p.bahan || []).length)
    p.bahan.forEach(it => { it.jumlah = num(it.jumlah) / porsi; });
  p.basis = 'porsi';
  return true;
}

/* Jaga-jaga data lama atau data cloud yang kehilangan field.
   Dijalankan juga pada data yang datang dari perangkat lain, supaya takaran
   per batch tidak pernah bertahan di mana pun. */
function rapikan() {
  Object.values(S.produk).forEach(p => {
    if (!Array.isArray(p.bahan)) p.bahan = [];
    if (!Array.isArray(p.ops)) p.ops = [];
    if (keBasisPorsi(p)) simpanProduk(p);
  });
}

/* ===================================================================
   VERSI
   Service worker menyimpan berkas untuk dipakai offline. Kalau perangkat masih
   memegang berkas lama, aplikasinya terlihat "tidak berubah" padahal server
   sudah diperbarui. Bagian ini membuat keadaan itu kelihatan, bukan ditebak.
   =================================================================== */
function tanyaVersiSW() {
  return new Promise(selesai => {
    const sw = navigator.serviceWorker;
    if (!sw || !sw.controller) return selesai(null);
    let sudah = false;
    const ch = new MessageChannel();
    const jam = setTimeout(() => { if (!sudah) { sudah = true; selesai(null); } }, 1500);
    ch.port1.onmessage = e => { if (sudah) return; sudah = true; clearTimeout(jam); selesai(e.data); };
    try { sw.controller.postMessage('versi', [ch.port2]); }
    catch (e) { clearTimeout(jam); selesai(null); }
  });
}
const nomorCache = nama => { const m = /-v(\d+)$/.exec(String(nama || '')); return m ? m[1] : null; };

async function tandaiVersi() {
  const c = $('#chipVersi');
  if (!c) return;
  c.textContent = 'v' + VERSI;
  const n = nomorCache(await tanyaVersiSW());
  const beda = !!(n && n !== VERSI);
  c.classList.toggle('beda', beda);
  c.title = beda
    ? `Aplikasi v${VERSI}, cache offline v${n} — muat ulang halaman untuk menyamakan`
    : `Versi aplikasi v${VERSI}`;
}

async function isiVersiCache() {
  const n = nomorCache(await tanyaVersiSW());
  const el = $('#versiCache');
  if (el) el.textContent = n ? 'v' + n : 'tidak aktif';
  const kabar = $('#kabarVersi');
  if (kabar) {
    kabar.innerHTML = (n && n !== VERSI)
      ? `<div class="note warn" style="margin-bottom:12px"><span class="ic">⚠️</span><span>
          <b>Perangkat ini masih memegang berkas lama.</b> Tekan tombol di bawah, lalu muat ulang halaman.
          Kalau masih sama, tekan Ctrl+Shift+R.</span></div>`
      : '';
  }
}

async function periksaPembaruan() {
  const s = $('#statusVersi');
  const tulis = (t, warna) => { if (s) { s.textContent = t; s.style.color = warna; } };
  if (!navigator.serviceWorker) { tulis('Peramban ini tidak memakai cache offline.', 'var(--tinta-2)'); return; }
  tulis('Memeriksa…', 'var(--tinta-2)');
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    if (reg) await reg.update();
    await new Promise(r => setTimeout(r, 900));
    await isiVersiCache();
    const n = nomorCache(await tanyaVersiSW());
    if (n && n !== VERSI) tulis('Pembaruan sedang diunduh. Muat ulang halaman sebentar lagi.', 'var(--hati-tinta)');
    else tulis('Sudah versi terbaru.', 'var(--baik-tinta)');
  } catch (e) {
    tulis('Gagal memeriksa. Muat ulang halaman dengan Ctrl+Shift+R.', 'var(--kritis-tinta)');
  }
}

/* Service worker baru mengambil alih: tandai supaya terlihat perlu muat ulang.
   Sengaja tidak memuat ulang sendiri — bisa memotong isian yang sedang diketik. */
if (navigator.serviceWorker) {
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    tandaiVersi();
    if (!$('#scrim').hidden) isiVersiCache();
  });
}

function unduhBackup() {
  const isi = { app:'kalkulator-hpp', versi:1, dibuat:new Date().toISOString(),
                data:{ bahan:S.bahan, produk:S.produk, setel:S.setel } };
  const blob = new Blob([JSON.stringify(isi, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const hariIni = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `backup-hpp-${hariIni}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  const s = $('#statusBackup');
  if (s) { s.textContent = '✅ File backup sudah diunduh.'; s.style.color = 'var(--baik-tinta)'; }
}
function pulihkanBackup(file) {
  const s = $('#statusBackup');
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const parsed = JSON.parse(ev.target.result);
      const d = parsed && parsed.data ? parsed.data : parsed;
      if (!d || typeof d !== 'object' || (!d.produk && !d.bahan)) throw new Error('bentuk tidak dikenali');
      const jmlP = Object.keys(d.produk || {}).length, jmlB = Object.keys(d.bahan || {}).length;
      S.bahan  = d.bahan || {};
      S.produk = d.produk || {};
      S.setel  = Object.assign({}, SETEL_AWAL, d.setel || {});
      Object.values(S.produk).forEach(p => { if (!Array.isArray(p.bahan)) p.bahan = []; if (!Array.isArray(p.ops)) p.ops = []; });
      tulisSemua({ versi:1, bahan:S.bahan, produk:S.produk, setel:S.setel });
      S.editId = null; render();
      if (s) { s.textContent = `✅ Dipulihkan: ${jmlP} produk, ${jmlB} bahan.`; s.style.color = 'var(--baik-tinta)'; }
    } catch (err) {
      if (s) { s.textContent = '❌ Gagal membaca file. Pastikan ini file backup HPP.'; s.style.color = 'var(--kritis-tinta)'; }
    }
  };
  reader.readAsText(file);
}
