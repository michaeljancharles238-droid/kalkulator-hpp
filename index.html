                  : status === 'galat' ? 'var(--kritis-tinta)'
                  : status === 'menyamakan' || status === 'memuat' ? 'var(--hati-tinta)'
                  : 'var(--tinta-3)';
    b.title = teksStatus();
  }
  const p = $('#panelAkun');
  if (p) p.innerHTML = panelAkunHTML();
}
function teksStatus() {
  switch (Sinkron.status) {
    case 'mati':        return 'Sinkronisasi belum disiapkan';
    case 'memuat':      return 'Menyiapkan sinkronisasi…';
    case 'perlu-masuk': return 'Belum masuk — data hanya di perangkat ini';
    case 'menyamakan':  return 'Menyamakan data…';
    case 'tersambung':  return 'Tersambung sebagai ' + Sinkron.email;
    case 'offline':     return 'Offline — perubahan dikirim saat online lagi';
    default:            return Sinkron.pesan || 'Sinkronisasi bermasalah';
  }
}

function panelAkunHTML() {
  if (!FIREBASE_CONFIG) {
    return `<div class="note info"><span class="ic">☁️</span><span>
      <b>Sinkronisasi belum disiapkan.</b> Data hanya tersimpan di perangkat ini.
      Isi <code>FIREBASE_CONFIG</code> di dalam <code>index.html</code> untuk menyalakannya.</span></div>`;
  }
  if (Sinkron.status === 'memuat')
    return `<div class="note info"><span class="ic">⏳</span><span>Menyiapkan sinkronisasi…</span></div>`;
  if (Sinkron.status === 'galat')
    return `<div class="note bad"><span class="ic">⚠️</span><span><b>Sinkronisasi gagal.</b> ${esc(Sinkron.pesan)}</span></div>`;
  if (!Sinkron.masuk) {
    return `<div class="note info" style="margin-bottom:12px"><span class="ic">☁️</span><span>
        Masuk dengan Google supaya data yang sama terbaca di HP maupun PC.</span></div>
      <button class="btn primary" data-aksi="masuk" style="width:100%;justify-content:center">Masuk dengan Google</button>`;
  }
  const kabar = Sinkron.status === 'offline'
    ? `<div class="note warn" style="margin-top:10px"><span class="ic">📡</span><span>
        Sedang offline. Perubahanmu tersimpan di perangkat dan dikirim otomatis saat online lagi.</span></div>`
    : `<div class="note ok" style="margin-top:10px"><span class="ic">✅</span><span>
        Tersambung. Perubahan di perangkat lain muncul di sini secara otomatis.</span></div>`;
  return `<div style="display:flex;align-items:center;gap:11px;flex-wrap:wrap">
      <div style="flex:1;min-width:0">
        <div class="eyebrow">Masuk sebagai</div>
        <div style="font-size:13.5px;font-weight:600;overflow-wrap:anywhere">${esc(Sinkron.email)}</div>
      </div>
      <button class="btn ghost" data-aksi="keluar">Keluar</button>
    </div>${kabar}`;
}

async function mulaiSinkron() {
  if (!FIREBASE_CONFIG) { aturStatus('mati'); return; }
  aturStatus('memuat');
  try {
    await muatSkrip(SDK + 'firebase-app-compat.js');
    await Promise.all([
      muatSkrip(SDK + 'firebase-auth-compat.js'),
      muatSkrip(SDK + 'firebase-firestore-compat.js'),
    ]);
    const fb = window.firebase;
    if (!fb) throw new Error('SDK Firebase tidak termuat');
    if (!fb.apps.length) fb.initializeApp(FIREBASE_CONFIG);
    Sinkron.auth = fb.auth();
    Sinkron.db = fb.firestore();
    // Cache lokal Firestore: aplikasi tetap bisa dipakai saat sinyal hilang.
    try { await Sinkron.db.enablePersistence({ synchronizeTabs:true }); } catch (e) { /* tab lain sudah memakainya */ }
    Sinkron.siapPakai = true;

    Sinkron.auth.onAuthStateChanged(async akun => {
      lepasLangganan();
      if (!akun) {
        Sinkron.masuk = false; Sinkron.uid = null; Sinkron.email = '';
        aturStatus('perlu-masuk');
        return;
      }
      Sinkron.masuk = true; Sinkron.uid = akun.uid; Sinkron.email = akun.email || akun.displayName || 'akun Google';
      Sinkron.akar = Sinkron.db.collection('users').doc(akun.uid);
      aturStatus('menyamakan');
      try { await samakanAwal(); langganan(); aturStatus('tersambung'); }
      catch (e) { aturStatus('galat', pesanGalat(e)); }
    });

    window.addEventListener('online',  () => { if (Sinkron.masuk) aturStatus('tersambung'); });
    window.addEventListener('offline', () => { if (Sinkron.masuk) aturStatus('offline'); });
  } catch (e) {
    aturStatus('galat', pesanGalat(e));
  }
}
function pesanGalat(e) {
  const kode = (e && e.code) || '';
  if (kode === 'permission-denied') return 'Security rules menolak akses. Pastikan rules Firestore sudah dipasang.';
  if (kode === 'auth/popup-blocked') return 'Jendela login diblokir peramban. Izinkan popup untuk situs ini.';
  if (kode === 'auth/unauthorized-domain') return 'Domain ini belum didaftarkan di Firebase → Authentication → Settings → Authorized domains.';
  if (kode === 'failed-precondition') return 'Firestore belum dibuat di proyek Firebase ini.';
  return (e && e.message) || 'Penyebab tidak diketahui.';
}

async function masukGoogle() {
  if (!Sinkron.auth) return;
  try {
    const p = new window.firebase.auth.GoogleAuthProvider();
    await Sinkron.auth.signInWithPopup(p);
  } catch (e) {
    if (e && e.code === 'auth/popup-closed-by-user') return;   // dibatalkan sendiri, bukan galat
    aturStatus('galat', pesanGalat(e));
  }
}
async function keluarAkun() {
  if (!Sinkron.auth) return;
  lepasLangganan();
  try { await Sinkron.auth.signOut(); } catch (e) {}
}
function lepasLangganan() { Sinkron.lepas.forEach(f => { try { f(); } catch (e) {} }); Sinkron.lepas = []; }

/* Pertemuan pertama antara data perangkat dan data cloud.
   Cloud kosong  → data perangkat ini diunggah.
   Cloud berisi  → cloud yang dipakai, data perangkat ditimpa.  */
async function samakanAwal() {
  const [snapP, snapB] = await Promise.all([
    Sinkron.akar.collection('produk').get(),
    Sinkron.akar.collection('bahan').get(),
  ]);
  const cloudKosong = snapP.empty && snapB.empty;
  const adaLokal = Object.keys(S.produk).length || Object.keys(S.bahan).length;

  if (cloudKosong && adaLokal) { await dorongSemua(); return; }
  if (cloudKosong) return;

  const produk = {}, bahan = {};
  snapP.forEach(d => { produk[d.id] = Object.assign({}, d.data(), { id:d.id }); });
  snapB.forEach(d => { bahan[d.id]  = Object.assign({}, d.data(), { id:d.id }); });
  S.produk = produk; S.bahan = bahan;
  try {
    const setel = await Sinkron.akar.collection('meta').doc('setel').get();
    if (setel.exists) S.setel = Object.assign({}, SETEL_AWAL, setel.data());
  } catch (e) {}
  kotor.produk.clear(); kotor.bahan.clear(); kotor.setel = false;
  kotor.buangProduk.clear(); kotor.buangBahan.clear();
  terapkanJauh();
}

function langganan() {
  const pasang = (ref, fn) => { try { Sinkron.lepas.push(ref.onSnapshot(fn, e => aturStatus('galat', pesanGalat(e)))); } catch (e) {} };
  pasang(Sinkron.akar.collection('produk'), snap => terimaKoleksi('produk', snap));
  pasang(Sinkron.akar.collection('bahan'),  snap => terimaKoleksi('bahan',  snap));
  pasang(Sinkron.akar.collection('meta').doc('setel'), d => {
    if (d.metadata.hasPendingWrites) return;
    if (d.exists) { S.setel = Object.assign({}, SETEL_AWAL, d.data()); terapkanJauh(); }
  });
}
function terimaKoleksi(jenis, snap) {
  // Lewati gema tulisan sendiri: kalau tidak, apa yang sedang diketik bisa tertimpa.
  if (snap.metadata.hasPendingWrites) return;
  // Masih ada perubahan lokal yang belum terkirim? Data cloud lebih tua — jangan dipakai,
  // nanti ketikan terakhir hilang. Snapshot berikutnya (setelah terkirim) yang dipakai.
  const antre = jenis === 'produk' ? (kotor.produk.size || kotor.buangProduk.size)
                                   : (kotor.bahan.size  || kotor.buangBahan.size);
  if (antre || Sinkron.sibuk) return;
  const baru = {};
  snap.forEach(d => { baru[d.id] = Object.assign({}, d.data(), { id:d.id }); });
  if (jenis === 'produk') S.produk = baru; else S.bahan = baru;
  terapkanJauh();
}
/* Perubahan dari perangkat lain: jangan gambar ulang kolom isian
   kalau jari masih di atasnya — nanti kursornya lompat. */
function terapkanJauh() {
  rapikan();
  tulisSemua({ versi:1, bahan:S.bahan, produk:S.produk, setel:S.setel });
  if (S.editId && !S.produk[S.editId]) S.editId = null;
  const el = document.activeElement;
  if (S.editId && el && el.closest && el.closest('#editor')) { S.tundaRender = true; renderHasil(); return; }
  render();
}

async function dorongSemua() {
  const b = Sinkron.db.batch();
  Object.values(S.produk).forEach(p => b.set(Sinkron.akar.collection('produk').doc(p.id), bersihkan(p)));
  Object.values(S.bahan).forEach(x  => b.set(Sinkron.akar.collection('bahan').doc(x.id),  bersihkan(x)));
  b.set(Sinkron.akar.collection('meta').doc('setel'), Object.assign({}, S.setel));
  b.set(Sinkron.akar, { dibuat:Date.now() }, { merge:true });
  await b.commit();
}
/* Firestore menolak undefined; buang juga field id (sudah jadi nama dokumen). */
function bersihkan(o) { return JSON.parse(JSON.stringify(Object.assign({}, o, { id:undefined }))); }

async function dorongKeCloud() {
  if (!Sinkron.masuk || !Sinkron.akar || Sinkron.sibuk) return;
  const adaKerja = kotor.produk.size || kotor.bahan.size || kotor.setel || kotor.buangProduk.size || kotor.buangBahan.size;
  if (!adaKerja) return;
  Sinkron.sibuk = true;
  const kerja = {
    produk: [...kotor.produk], bahan: [...kotor.bahan], setel: kotor.setel,
    buangProduk: [...kotor.buangProduk], buangBahan: [...kotor.buangBahan],
  };
  kotor.produk.clear(); kotor.bahan.clear(); kotor.setel = false;
  kotor.buangProduk.clear(); kotor.buangBahan.clear();
  try {
    const b = Sinkron.db.batch();
    kerja.produk.forEach(id => { if (S.produk[id]) b.set(Sinkron.akar.collection('produk').doc(id), bersihkan(S.produk[id])); });
    kerja.bahan.forEach(id  => { if (S.bahan[id])  b.set(Sinkron.akar.collection('bahan').doc(id),  bersihkan(S.bahan[id])); });
    kerja.buangProduk.forEach(id => b.delete(Sinkron.akar.collection('produk').doc(id)));
    kerja.buangBahan.forEach(id  => b.delete(Sinkron.akar.collection('bahan').doc(id)));
    if (kerja.setel) b.set(Sinkron.akar.collection('meta').doc('setel'), Object.assign({}, S.setel));
    await b.commit();
    if (Sinkron.status !== 'offline') aturStatus('tersambung');
  } catch (e) {
    // Kembalikan ke daftar kotor supaya dicoba lagi pada perubahan berikutnya.
    kerja.produk.forEach(id => kotor.produk.add(id));
    kerja.bahan.forEach(id => kotor.bahan.add(id));
    kerja.buangProduk.forEach(id => kotor.buangProduk.add(id));
    kerja.buangBahan.forEach(id => kotor.buangBahan.add(id));
    if (kerja.setel) kotor.setel = true;
    aturStatus(navigator.onLine === false ? 'offline' : 'galat', pesanGalat(e));
  } finally {
    Sinkron.sibuk = false;
  }
}

document.addEventListener('click', e => {
  if (e.target.closest('#btnSinkron')) { sheetPengaturan(); return; }
  const a = e.target.closest('[data-aksi]');
  if (!a) return;
  if (a.dataset.aksi === 'masuk') masukGoogle();
  else if (a.dataset.aksi === 'keluar') keluarAkun();
  else if (a.dataset.aksi === 'periksa-versi') periksaPembaruan();
});

/* ===================================================================
   MULAI
   =================================================================== */
muatAwal();
pasangTema(temaSekarang());
tandaiVersi();
aturStatus(FIREBASE_CONFIG ? 'memuat' : 'mati');
mulaiSinkron();
</script>
